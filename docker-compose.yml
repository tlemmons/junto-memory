services:
  chromadb:
    # Chroma 1.x (Rust rewrite). The image ID we use locally is sha256:501769453712...
    # which corresponds to the public tag chromadb/chroma:1.2.4 (released 2025-12-12).
    # Adopters get the same bits via Docker Hub.
    #
    # Do NOT downgrade to 0.6.x — different SQLite schema, can't read 1.x data
    # (verified 2026-04-17 during migration: 0 collections visible after downgrade).
    # When upgrading to a newer 1.x point release, test on a volume COPY first.
    image: chromadb/chroma:1.2.4
    container_name: mcp-chromadb
    # Chroma 1.x persists to /data by default. The previous mount at
    # /chroma/chroma was silently ignored, causing the Apr 2026 data loss
    # incident when the pre-existing container was recreated. Keep this
    # at /data and never change it without testing a container rebuild.
    volumes:
      - chroma-data:/data
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    healthcheck:
      # This image doesn't ship curl/wget. Use bash's /dev/tcp to check if
      # the HTTP port accepts connections (opens socket, immediately closes).
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mongodb:
    # Pinned version for the same reason as chromadb above.
    image: mongo:7.0
    container_name: mcp-mongodb
    # Single-node replica set so we get multi-document transactions and
    # change streams (needed for Phase 1 op-log atomicity). The replica
    # set name is rs0; client connection strings need `?replicaSet=rs0`
    # to use member discovery, or `?directConnection=true` to bypass it
    # (required for host-side debugging via localhost:27019 since the
    # replica set advertises the docker-network hostname "mongodb").
    #
    # The keyfile is required for internal replication-protocol auth
    # whenever --auth is on, even for single-member sets. The image
    # entrypoint enables auth automatically when MONGO_INITDB_ROOT_USERNAME
    # is set, so we always need the keyfile here. Keyfile must be:
    #   - mode 400 (owner-only read)
    #   - owned by UID 999 (the mongo user inside the container)
    # If you regenerate it: `openssl rand -base64 756 > secrets/mongo-keyfile`
    # then `chmod 400 secrets/mongo-keyfile && sudo chown 999:999 secrets/mongo-keyfile`.
    command:
      - "mongod"
      - "--replSet"
      - "rs0"
      - "--keyFile"
      - "/etc/mongo/keyfile"
      - "--bind_ip_all"
    volumes:
      - mongo-data:/data/db
      - ./secrets/mongo-keyfile:/etc/mongo/keyfile:ro
    ports:
      - "${MONGO_PORT:-27019}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mcp_orch}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mcp_orchestrator}
    healthcheck:
      # --quiet suppresses the connect banner; we hit a uninitialized-replSet
      # member here right after recreation, so use directConnection to avoid
      # the client doing replica-set discovery before rs.initiate() runs.
      test: ["CMD", "mongosh", "--quiet", "--norc", "mongodb://localhost:27017/?directConnection=true", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: mcp-rag-arch
    depends_on:
      chromadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file: .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  # These volumes are declared external so compose never creates or destroys
  # them — populated in 2026-04-14 during data-loss recovery. A fresh deploy
  # elsewhere should remove the `external` + `name` fields so compose creates
  # them automatically on first `up -d`.
  chroma-data:
    external: true
    name: chroma-persistent
  mongo-data:
    external: true
    name: mcp-mongo-persistent
